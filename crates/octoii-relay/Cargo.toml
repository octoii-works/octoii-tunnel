[package]
name = "octoii-relay"
description = "Octoii's relay on Cloudflare: a machine's home, a Durable Object, carrying datagrams between the machine and the devices that reach it, each known by its key"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
blake3 = "1.8.7"
bytes = "1.12.1"
getrandom = "0.4.3"
iroh-base = { version = "1.4.1", default-features = false, features = ["key"] }
postcard = { version = "1.1.3", features = ["alloc"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
thiserror = "2.0.21"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4.3", features = ["wasm_js"] }
wasm-bindgen = "0.2.130"
worker = "0.8.7"

[dev-dependencies]
axum = { version = "0.8.9", features = ["ws"] }
futures-util = "0.3.34"
http = "1.5.0"
http-body-util = "0.1.5"
octoii-tunnel = { path = "../octoii-tunnel" }
tower = { version = "0.5.3", features = ["util"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync"] }
