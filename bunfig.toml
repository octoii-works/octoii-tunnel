[install]
linker = "isolated"
hoist = false
exact = true
auto = "disable"
# Only install dependency versions published at least three days ago, so a compromised or broken release has time to be withdrawn.
minimumReleaseAge = 259200

[test]
# Tests run per package (`bun run test`), never from the root.
root = "./do-not-run-tests-from-root"

[fmt]
# Format as oxfmt does; without it, bun fmt starts from Prettier's defaults.
flavor = "oxfmt"
useTabs = true
printWidth = 160
ignorePatterns = ["node_modules/", "dist/"]
