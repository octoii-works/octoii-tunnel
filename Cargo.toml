[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Dependencies built optimized even in a debug build; our own code stays a debug build.
[profile.dev.package."*"]
opt-level = 2

# HTTP/3 at its newest commit: WebSocket over HTTP/3 (RFC 9220) is past its last release.
# The endpoint from our fork, its crates all from one commit: a custom transport's address found while connected opens
# a path.
[patch.crates-io]
h3 = { git = "https://github.com/hyperium/h3", rev = "43745ad87e95b0c035ac9c547aad467303213425" }
iroh = { git = "https://github.com/octoii-works/iroh", rev = "31b2c7d3f9fa333b8928a761ca7dbcd5dbbab599" }
iroh-base = { git = "https://github.com/octoii-works/iroh", rev = "31b2c7d3f9fa333b8928a761ca7dbcd5dbbab599" }
iroh-dns = { git = "https://github.com/octoii-works/iroh", rev = "31b2c7d3f9fa333b8928a761ca7dbcd5dbbab599" }
iroh-relay = { git = "https://github.com/octoii-works/iroh", rev = "31b2c7d3f9fa333b8928a761ca7dbcd5dbbab599" }

# The tunnel's WebAssembly is what a browser loads before it reaches a machine: optimized for size, linked whole.
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
